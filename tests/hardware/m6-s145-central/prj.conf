# Logging and deterministic VCOM result output
CONFIG_LOG=y
CONFIG_LOG_BACKEND_BM_UARTE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Official S145 and SoftDevice handler
CONFIG_SOFTDEVICE=y
CONFIG_NRF_SDH_BLE_TOTAL_LINK_COUNT=2
CONFIG_NRF_SDH_BLE_CENTRAL_LINK_COUNT=1

# Official LESC crypto and Peer Manager
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=1
CONFIG_PEER_MANAGER=y
CONFIG_PM_LESC=y
CONFIG_BM_ZMS=y
CONFIG_BM_TIMER=y

# Official name-filtered scanner
CONFIG_BLE_SCAN=y
CONFIG_BLE_SCAN_NAME_COUNT=1
CONFIG_BLE_ADV_DATA=y

CONFIG_NRFKIT_M6_CENTRAL_BOND=n
CONFIG_NRFKIT_M6_CENTRAL_LESC=n
CONFIG_NRFKIT_M6_CENTRAL_IO_NONE=y
